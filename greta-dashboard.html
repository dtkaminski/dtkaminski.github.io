  /* An empty state is a sentence with room around it, not a bare line jammed against a rule. */
  .v3-empty { font-family: var(--font-sans); font-size: var(--text-sm, 13px); color: var(--color-muted);
              padding: var(--space-5, 20px) 0; border-top: 1px solid var(--color-line); line-height: 1.55; }

  /* Motion is decoration; if the viewer has asked for less of it, they get none. */
  @media (prefers-reduced-motion: reduce) {
    .v3-skel { animation: none; background: var(--color-sunken, #EFEAE3); }
    .v3-enter { animation: none; }
    .v3-flow-seg, .v3-rank-bar i { transition: none; }
  }

  /* ── Drill into a figure ────────────────────────────────────────────────────────────────────
     The number must look exactly as it did — inheriting size, weight and font from its container —
     so the affordance is a quiet dotted rule under it, not a button wrapped around it. A headline
     figure that suddenly looks clickable reads as a control; this reads as a number you can ask
     about, which is what it is. */
  .v3-fig-wrap { position: relative; display: inline-block; }
  .v3-fig-hit { font: inherit; color: inherit; letter-spacing: inherit; background: none; border: 0;
                padding: 0; cursor: pointer; display: inline-flex; align-items: baseline; gap: 0; }
  .v3-fig-cue { display: inline-block; align-self: flex-end; width: 100%; position: absolute;
                left: 0; right: 0; bottom: .08em; height: 0;
                border-bottom: 1px dotted var(--color-line-strong, var(--color-line)); }
  .v3-fig-hit:hover .v3-fig-cue { border-bottom-color: var(--color-accent); }
  .v3-sheet-fig { font-family: var(--font-sans); }
  .v3-fig-rows { display: block; margin: var(--space-2, 8px) 0; }
  .v3-fig-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3, 12px);
                padding: 3px 0; border-top: 1px solid var(--color-line); }
  .v3-fig-row:first-child { border-top: 0; }
  .v3-fig-row-lab { font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--color-muted); }
  .v3-fig-row-val { font-family: var(--font-mono); font-size: var(--text-sm, 13px); color: var(--color-ink); }

  /* ── Channel scoreboard ─────────────────────────────────────────────────────────────────────
     One shared iROAS scale so channels are comparable, with each channel's break-even marked. The
     tick carries more meaning than the bar: 1.14x looks fine alone and is barely clearing against
     a 0.93x target. Accent when it clears, danger when it does not. */
  .v3-score { margin-bottom: var(--space-5, 20px); }
  .v3-score-head { display: flex; align-items: baseline; justify-content: space-between;
                   flex-wrap: wrap; gap: var(--space-2, 8px); padding-bottom: var(--space-3, 12px); }
  .v3-score-title { margin: 0; font-family: var(--font-sans); font-size: var(--text-base, 15px); color: var(--color-ink); }
  .v3-score-key { font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--color-muted); }
  .v3-score-list { list-style: none; margin: 0; padding: 0; }
  .v3-score-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.7fr) auto auto;
                  gap: var(--space-3, 12px); align-items: center;
                  padding: var(--space-2, 8px) 0; border-top: 1px solid var(--color-line); }
  .v3-score-row:last-child { border-bottom: 1px solid var(--color-line); }
  .v3-score-name { font-family: var(--font-sans); font-size: var(--text-sm, 13px); color: var(--color-ink);
                   text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v3-score-track { position: relative; height: 8px; background: var(--color-sunken, #EFEAE3); }
  .v3-score-bar { position: absolute; left: 0; top: 0; height: 100%; background: var(--color-accent);
                  transition: width var(--transition-base, .25s) ease; }
  .v3-score-row.under .v3-score-bar { background: var(--color-danger); }
  .v3-score-tick { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--color-ink); }
  .v3-score-x { font-family: var(--font-mono); font-size: var(--text-sm, 13px); color: var(--color-ink); }
  .v3-score-row.under .v3-score-x { color: var(--color-danger); }
  .v3-score-spend { font-family: var(--font-mono); font-size: var(--text-xs, 11px); color: var(--color-muted); text-align: right; }
  @media (max-width: 680px) {
    .v3-score-row { grid-template-columns: 1fr auto auto; grid-template-areas: "name x spend" "track track track"; }
    .v3-score-name { grid-area: name; } .v3-score-track { grid-area: track; }
    .v3-score-x { grid-area: x; } .v3-score-spend { grid-area: spend; }
  }

  /* ── The ranked action board ────────────────────────────────────────────────────────────────
     One list, ordered by money, with the bar carrying the comparison so the eye does the ranking
     instead of the reader. Rows are separated by a hairline, not boxed — per the house rules there
     is no card here and no shadow. Figures are mono, labels sans, and the only colour is accent on
     the bar, so scanning is size-first. */
  .v3-board { margin-top: var(--space-2, 8px); }
  .v3-board-head { display: flex; align-items: baseline; justify-content: space-between;
                   flex-wrap: wrap; padding-bottom: var(--space-3, 12px); }
  .v3-board-total { font-family: var(--font-mono); font-size: var(--text-lg, 20px); color: var(--color-ink); }
  .v3-board-total-lab { font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--color-muted); }
  /* Unverified money is stated, never merged into the headline: a second line rather than a
     bigger first one. flex-basis 100% is what actually puts it on its own line — the parent is a
     space-between flex row, so display:block alone left it sitting beside the total. Muted, not
     faint: faint is #726E66, which is 4.49:1 on the #F2F1ED canvas and misses AA by a hair at
     11px. Quietness comes from the size and the sans face instead. */
  .v3-board-unver { flex: 0 0 100%; margin-top: var(--space-1, 4px); font-family: var(--font-sans);
                    font-size: var(--text-xs, 11px); color: var(--color-muted); }

  /* The break that tells the reader the list changed meaning. A rule and a label, not a card:
     this is a section boundary, not elevated content. */
  .v3-rank-break { display: block; list-style: none; margin-top: var(--space-6, 24px);
                   padding-top: var(--space-4, 16px);
                   /* line-strong, because every row border is already --color-line: at the same
                      weight this boundary reads as one more row, which is the opposite of the
                      point. */
                   border-top: 1px solid var(--color-line-strong); }
  /* .v3-kick carries margin-bottom and no display, and every other use of it in the app is on a
     div. This one is a span, so the margin was being dropped and the label sat on the sentence. */
  .v3-rank-break .v3-kick { display: block; }
  .v3-rank-break .v3-sub { display: block; max-width: 62ch; }
  /* Demoted rows read quieter without going invisible — the money is still real. */
  .v3-rank-row.unver .v3-rank-desc { color: var(--color-muted); }
  .v3-rank-row.unver .v3-rank-bar i { background: var(--color-faint); }
  .v3-rank-unver { margin: 0 0 var(--space-3, 12px); font-family: var(--font-sans);
                   font-size: var(--text-sm, 13px); color: var(--color-muted); line-height: 1.6;
                   border-left: 2px solid var(--color-line-strong);
                   padding-left: var(--space-3, 12px); }

  .v3-chips { display: flex; flex-wrap: wrap; gap: var(--space-2, 8px); padding-bottom: var(--space-3, 12px); }
  .v3-chip { font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--color-muted);
             background: none; border: 1px solid var(--color-line); border-radius: var(--radius-md, 4px);
             padding: 3px 9px; cursor: pointer; text-transform: capitalize;
             transition: color var(--transition-fast, .15s) ease, border-color var(--transition-fast, .15s) ease; }
  .v3-chip:hover { color: var(--color-ink); border-color: var(--color-line-strong, var(--color-line)); }
  .v3-chip.on { color: var(--color-panel); background: var(--color-ink); border-color: var(--color-ink); }
  .v3-chip-n { font-family: var(--font-mono); opacity: .7; margin-left: 3px; }

  .v3-rank { list-style: none; margin: 0; padding: 0; }
  .v3-rank-row { border-top: 1px solid var(--color-line); }
  .v3-rank-row:last-child { border-bottom: 1px solid var(--color-line); }
  .v3-rank-hit { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3, 12px);
                 align-items: start; width: 100%; background: none; border: 0;
                 padding: var(--space-3, 12px) 0; text-align: left; cursor: pointer; }
  .v3-rank-hit:hover .v3-rank-desc { color: var(--color-accent); }
  .v3-rank-n { font-family: var(--font-mono); font-size: var(--text-xs, 11px); color: var(--text-faint, var(--color-muted));
               padding-top: 2px; min-width: 1.4em; }
  .v3-rank-body { min-width: 0; }
  .v3-rank-desc { display: block; font-family: var(--font-sans); font-size: var(--text-sm, 13px);
                  color: var(--color-ink); line-height: 1.45;
                  transition: color var(--transition-fast, .15s) ease; }
  /* Some descriptions run to several hundred characters — a narrative, a data caveat and a list of
     coincident changes in one string. Unclamped, one row owns the screen and the ranking stops
     being scannable. Two lines closed, everything on open. */
  .v3-rank-desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                        overflow: hidden; }
  /* The plain title leads in ink at weight; the one-line why sits under it in the muted voice,
     clamped closed like the description used to be. The engine's own sentence moves into the
     open row as "Greta's working". */
  .v3-rank-desc { font-weight: var(--weight-semi, 600); }
  .v3-rank-plain { display: block; margin-top: 2px; font-family: var(--font-sans); font-size: var(--text-sm, 13px);
                   color: var(--color-muted); line-height: 1.45; }
  .v3-rank-plain.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .v3-rank-raw { margin: var(--space-3, 12px) 0 0; padding-top: var(--space-2, 8px); border-top: 1px solid var(--color-line);
                 font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--color-muted); line-height: 1.5; }
  .v3-rank-raw .v3-kick { display: block; margin-bottom: 2px; }
  .v3-why-open { margin-top: var(--space-3, 12px); padding-top: var(--space-3, 12px); border-top: 1px solid var(--color-line); }
  .v3-why-open .v3-note { margin: var(--space-1, 4px) 0 var(--space-2, 8px); }
  .v3-score-verdict { margin: 0 0 var(--space-3, 12px); font-family: var(--font-sans); font-size: var(--text-base); color: var(--color-ink); line-height: var(--leading-body, 1.5); max-width: var(--measure, 68ch); }
  .v3-rank-bar { display: block; height: 3px; background: var(--color-sunken, #EFEAE3); margin: 6px 0 4px; }
  .v3-rank-bar i { display: block; height: 100%; background: var(--color-accent);
                   transition: width var(--transition-base, .25s) ease; }
  .v3-rank-meta { font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--color-muted);
                  text-transform: capitalize; }
  .v3-rank-gbp { font-family: var(--font-mono); font-size: var(--text-base, 15px); color: var(--color-ink); white-space: nowrap; }
  .v3-rank-per { font-size: var(--text-xs, 11px); color: var(--text-faint, var(--color-muted)); }
  /* A row's controls: the remedy where there is one, and always Mark done. Indented to
     the row body so they read as belonging to that action, and above the expander so
     they do not move when a row opens. */
  .v3-rank-fix { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2, 8px);
                 padding: 0 0 var(--space-3, 12px) calc(1.4em + var(--space-3, 12px)); }
  .v3-fix-err { font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--bad, var(--color-accent));
                align-self: center; }
  /* The rest of the playbook, fetched on demand into the hero. */
  .v3-steps { margin: var(--space-3, 12px) 0 0; padding-left: 1.1em; }
  .v3-steps li { font-family: var(--font-sans); font-size: var(--text-sm, 13px); color: var(--color-muted);
                 line-height: 1.6; margin-bottom: 4px; }
  /* A closed action states the consequence, because closing one suppresses it for 30 days. */
  .v3-resolved { margin-top: var(--space-3, 12px); border-left: 2px solid var(--good, var(--color-accent));
                 padding-left: var(--space-3, 12px); }
  .v3-rank-why { padding: 0 0 var(--space-4, 16px) calc(1.4em + var(--space-3, 12px)); }
  .v3-rank-steps { margin: 0; padding-left: 1.1em; }
  .v3-rank-steps li { font-family: var(--font-sans); font-size: var(--text-sm, 13px);
                      color: var(--color-muted); line-height: 1.6; margin-bottom: 4px; }
  .v3-rank-nosteps { margin: 0; font-family: var(--font-sans); font-size: var(--text-sm, 13px); color: var(--color-muted); }
  .v3-empty { font-family: var(--font-sans); font-size: var(--text-sm, 13px); color: var(--color-muted);
              padding: var(--space-4, 16px) 0; border-top: 1px solid var(--color-line); }
  @media (max-width: 680px) {
    .v3-rank-hit { grid-template-columns: auto 1fr; }
    .v3-rank-gbp { grid-column: 2; padding-top: 2px; }
  }

  /* The money read leads Profit & sales, so it gets room rather than a card around it. */
  .v3-profit-lead { margin-bottom: var(--space-5, 20px); }
  .v3-profit-lead .v3-flow { border-top: 0; padding-top: 0; margin-top: 0; }

  /* A pointer to the destination that owns a thing, instead of a third copy of it. Reads as a
     quiet line of text, not a button competing with the page. */
  .v3-xref { display: flex; align-items: baseline; gap: var(--space-2, 8px); width: 100%;
             background: none; border: 0; border-top: 1px solid var(--color-line);
             padding: var(--space-3, 12px) 0; margin: var(--space-2, 8px) 0 0;
             font-family: var(--font-sans); font-size: var(--text-sm, 13px);
             color: var(--color-muted); cursor: pointer; text-align: left; }
  .v3-xref:hover { color: var(--color-ink); }
  .v3-xref-go { color: var(--color-accent); }

  /* ── Where the money goes ───────────────────────────────────────────────────────────────────
     One proportional track, not three cards. Per the house rules: no panel/shadow stack, square
     containers, whitespace and a hairline rule instead of boxes, --font-mono on every figure and
     --font-sans on every label. Colour carries meaning and nothing else — accent for what the
     owner keeps, muted for what left the business — so the eye lands on the kept share first.
     A feed that has gone quiet is drawn hatched, so an understated bar looks understated. */
  .v3-flow { margin-top: var(--space-6); border-top: 1px solid var(--color-line); padding-top: var(--space-4); }
  .v3-flow-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3, 12px);
                 width: 100%; background: none; border: 0; padding: 0 0 var(--space-2, 8px); cursor: pointer; text-align: left; }
  .v3-flow-top-lab { font-family: var(--font-sans); font-size: var(--text-xs, 11px); letter-spacing: var(--tracking-wide);
                     text-transform: uppercase; color: var(--color-muted); }
  .v3-flow-top-val { font-family: var(--font-mono); font-size: var(--text-sm, 13px); color: var(--color-ink); }
  /* A 2px gap between segments, so three parts read as three parts before any colour is decoded.
     The two outgoing segments were both --color-muted, differing only by hatching, and at 10px
     tall the hatching read as texture rather than a boundary: the bar looked like "grey stuff,
     then orange". Now they step light -> mid -> accent, which also puts the money the owner keeps
     at the visually heaviest end. */
  .v3-flow-track { display: flex; gap: 2px; width: 100%; height: 12px; border-radius: var(--radius-none, 0); background: var(--color-sunken, #EFEAE3); }
  .v3-flow-seg { display: block; height: 100%; transition: width var(--transition-base, .25s) ease; }
  .v3-flow-cogs  { background: var(--color-line-strong); }
  .v3-flow-spend { background: var(--color-muted); }
  .v3-flow-keep  { background: var(--color-accent); }
  /* "Some days have not reported." A 62%-white barber-pole hatch at 12px tall did not read
     as incompleteness, it read as a rendering fault - and the legend underneath already says
     "missing days" in words. So the segment is simply held back instead: lightened, and given
     a dotted trailing edge where the unreported days would continue. Quieter, and it survives
     being looked at. */
  .v3-flow-soft { opacity: .55; border-right: 2px dotted var(--color-panel); }
  .v3-flow-legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3, 12px); margin-top: var(--space-3, 12px); }
  .v3-flow-item { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "dot val" "lab lab" "pct pct";
                  gap: 2px var(--space-2, 8px); align-items: center; background: none; border: 0; padding: 0;
                  text-align: left; cursor: pointer; border-top: 1px solid transparent; }
  .v3-flow-item:hover { border-top-color: var(--color-line-strong, var(--color-line)); }
  .v3-flow-item:hover .v3-flow-lab { color: var(--color-ink); }
  .v3-flow-dot { grid-area: dot; width: 8px; height: 8px; display: block; }

  .v3-flow-val { grid-area: val; font-family: var(--font-mono); font-size: var(--text-base, 15px); color: var(--color-ink); }
  .v3-flow-lab { grid-area: lab; font-family: var(--font-sans); font-size: var(--text-xs, 11px); color: var(--color-muted);
                 transition: color var(--transition-fast, .15s) ease; }
  .v3-flow-pct { grid-area: pct; font-family: var(--font-mono); font-size: var(--text-xs, 11px); color: var(--text-faint, var(--color-muted)); }
  @media (max-width: 680px) {
    .v3-flow-legend { grid-template-columns: 1fr; gap: var(--space-2, 8px); }
    .v3-flow-item { grid-template-columns: auto 1fr auto; grid-template-areas: "dot val pct" "lab lab lab"; }
  }

  /* One ladder: Direct > Likely > Probably > Possible > Outside chance, then "Not yet" for the
     cases Greta refuses to answer. The dot fades as the steer weakens, so the rung reads at a
     glance without having to parse the word. Old class names kept — older cached bundles still
     emit them and an unstyled dot would look broken. */
  .v3-conf-direct i   { background: var(--good); }
  .v3-conf-likely i   { background: var(--good); opacity: .6; }
  .v3-conf-probably i { background: var(--warn); }
  .v3-conf-possible i { background: var(--warn); opacity: .55; }
  .v3-conf-outside i  { background: none; border: 2px solid var(--text-muted); }
  .v3-conf-held i     { background: var(--border-default); }
  .v3-conf-measured i { background: var(--good); }
  .v3-conf-estimated i { background: var(--warn); }
  .v3-conf-benchmark i { background: none; border: 2px solid var(--text-muted); }
  .v3-sheet {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 60; width: min(320px, 78vw);
    display: flex; flex-direction: column; gap: 7px; padding: 14px;
    background: var(--bg-elevated, var(--bg-card)); border: 1px solid var(--border-default);
    border-radius: var(--r-md); box-shadow: 0 8px 28px rgba(0,0,0,.28); font-size: var(--text-sm); line-height: 1.5;
    color: var(--text-secondary); text-align: left; font-weight: var(--weight-normal); white-space: normal;
  }
  .v3-sheet b { color: var(--text-primary); }
  .v3-sheet-tech { color: var(--text-faint); font-size: var(--text-xs); }
  .v3-sheet-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

  /* Progressive disclosure */
  .v3-more { border-top: 1px solid var(--border-subtle); }
  .v3-more-head {
    display: flex; align-items: center; gap: 9px; width: 100%; min-height: 44px; padding: 10px 0;
    background: none; border: 0; color: var(--text-secondary); font-family: inherit;
    font-size: var(--text-sm); font-weight: var(--weight-semi); text-align: left; cursor: pointer;
  }
  .v3-more-head:hover { color: var(--text-primary); }
  .v3-more-caret { color: var(--color-accent); display: inline-flex; align-items: center;
    transition: transform var(--transition-fast, .15s) ease; }
  .v3-more-caret.open { transform: rotate(90deg); }
  .v3-more-body { padding-bottom: 8px; }

  /* Mobile: five places, Ask in the middle */
  .v3-mobile { display: none; }
  @media (max-width: 760px) {
    .v3-shell { display: block; }
    .v3-nav { display: none; }
    .v3-main { padding: 16px 16px 84px; max-width: none; }
    .v3-big { font-size: var(--text-data); }
    .v3-mobile {
      display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: var(--bg-app); border-top: 1px solid var(--border-default);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .v3-mb {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      min-height: 56px; background: none; border: 0; color: var(--text-muted); font-family: inherit; font-size: var(--text-xs); cursor: pointer;
    }
    .v3-mb.active { color: var(--accent); }
    .v3-sheet { position: fixed; left: 12px; right: 12px; bottom: 76px; top: auto; width: auto; }
  }


  /* Getting started — the first-run path (Phase 2 §6) */
  .v3-setup { border: 1px solid var(--accent); padding: 14px 16px; margin-bottom: 4px; background: var(--accent-bg); }
  .v3-steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
  .v3-step { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border-subtle); }
  .v3-step:first-child { border-top: 0; }
  .v3-step-mark {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-default); color: var(--text-muted);
    display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: var(--text-sm);
  }
  .v3-step.done .v3-step-mark { background: var(--good); border-color: var(--good); color: var(--color-panel); }
  .v3-step.next .v3-step-mark { border-color: var(--accent); color: var(--accent); }
  .v3-step.done .v3-step-body b { color: var(--text-muted); font-weight: var(--weight-medium); }
  .v3-step-body { display: grid; gap: 1px; font-size: var(--text-sm); min-width: 0; }
  .v3-step-body .v3-muted { font-size: var(--text-sm); }

  /* Ask Greta — permanent, on every screen (Phase 2 §7) */
  /* Sticky, so it needs to occlude cleanly. With padding only on the bottom, the page
     title slid under it and was sheared through the middle of the glyphs on scroll: the
     bar looked broken rather than pinned. Padding both sides plus a hairline underneath
     gives it an edge to be pinned AT, and the rule only appears once there is something
     scrolled beneath it. */
  .v3-askbar { position: sticky; top: var(--v3-top); z-index: 20; background: var(--color-panel);
               margin: 0 calc(-1 * var(--space-8)); padding: var(--space-3) var(--space-8) var(--space-4);
               border-bottom: 1px solid transparent;
               transition: border-color var(--transition-fast, .15s) ease; }
  .v3-askbar.stuck { border-bottom-color: var(--color-line); }
  .v3-askbar-in { display: flex; align-items: center; gap: 10px; border: 1px solid var(--color-line);
                  border-radius: var(--radius-md); background: var(--color-chrome);
                  padding: 6px 8px 6px 12px; color: var(--color-faint);
                  transition: border-color var(--transition-fast), background var(--transition-fast); }
  .v3-askbar-in:focus-within { border-color: var(--color-accent); background: var(--color-panel); }
  .v3-askbar-in input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none; min-height: 40px;
    font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-primary);
  }
  .v3-askbar-in input::placeholder { color: var(--text-muted); }
  .v3-askbar-sug { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 2px 0; font-size: var(--text-sm); }
  .v3-sug {
    border: 1px solid var(--border-default); background: var(--bg-card); color: var(--text-secondary);
    border-radius: var(--radius-md); min-height: 44px; padding: 0 12px; font-family: var(--font-sans); font-size: var(--text-sm); cursor: pointer;
  }
  .v3-sug:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 760px) {
    /* The sheet's gutter is 16px here, not 32 — drop the full bleed with it. */
    .v3-askbar { position: static; margin: 0; padding: var(--space-2) 0 var(--space-3); }
    .v3-askbar-sug { display: none; }
    /* At 375px the placeholder ran under the Ask button and was sheared off mid-word.
       Let the input shrink and the button keep its own width. */
    .v3-askbar-in { padding-left: var(--space-2); gap: var(--space-2); }
    .v3-askbar-in input { font-size: var(--text-sm); min-width: 0; }
    .v3-askbar-in input::placeholder { text-overflow: ellipsis; }
  }

  /* Period control (Numbers pages) */
  .v3-page-head-row { display: flex; gap: var(--s-4); align-items: flex-start; flex-wrap: wrap; }
  /* The thread back to the headline: on every page but Today, the number all of this
     is meant to move. Quiet by default -- it is context, not a call to action -- and
     numbers in mono like every other figure in the product. */
  .v3-thread { font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap;
    margin-top: var(--space-3); padding: var(--space-2) var(--space-3);
    background: var(--color-surface); border: 0; border-left: 2px solid var(--color-line-strong);
    border-radius: var(--radius-none); cursor: pointer; text-align: left; width: 100%;
    font-family: var(--font-sans); font-size: var(--text-xs); color: var(--color-muted); }
  .v3-thread:hover { border-left-color: var(--color-accent); background: var(--color-panel-hover); }
  .v3-thread-lab { text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--color-faint); }
  .v3-thread-val { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--weight-medium);
    color: var(--color-ink); }
  /* Sans: this slot holds a sentence ("pace too close to call") as often as it holds a
     figure ("£3,150 ahead"), and tabular-nums from .v3-thread already lines the digits up. */
  .v3-thread-pace { font-variant-numeric: tabular-nums; }
  .v3-thread-pace.good { color: var(--color-success); }
  .v3-thread-pace.bad  { color: var(--color-danger); }

  /* Business vitals: three stats, not a sentence of debug output. Rules between them
     instead of three boxes, per whitespace-over-cards. */
  /* FOCUS. Nothing in the product drew one: all 20 focusable elements on Today returned
     no outline and no box-shadow on :focus, so a keyboard user had no way to tell where
     they were. That is WCAG 2.4.7 failed outright, and it also makes the app unusable
     one-handed on a desktop. :focus-visible so a mouse click does not leave a ring behind,
     and an offset so the ring sits outside the control rather than on its edge. */
  :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }
  /* On the accent-filled primary button the ring has to sit against the button, not
     against the page, or it disappears into the fill. */
  .v3-btn-p:focus-visible, .v3-sug:focus-visible {
    outline-color: var(--color-ink);
  }
  /* The nav is on chrome, which is close enough to the accent at 2px to muddy it. */
  .v3-nav-item:focus-visible, .v3-mb:focus-visible {
    outline-offset: -2px;
  }
  /* Keyboard users land on the nav before the content on every page. */
  .v3-skip {
    position: absolute; left: var(--space-3); top: -100px; z-index: 100;
    background: var(--color-panel); color: var(--color-ink);
    border: 1px solid var(--color-accent); border-radius: var(--radius-md);
    padding: var(--space-2) var(--space-3); font-family: var(--font-sans);
    font-size: var(--text-sm); text-decoration: none;
    transition: top var(--transition-fast, .15s) ease;
  }
  .v3-skip:focus { top: var(--space-3); }

  .v3-vitals { border-top: 1px solid var(--color-line); border-bottom: 1px solid var(--color-line);
    padding: var(--space-4) 0; margin-bottom: var(--space-4); }
  .v3-vitals-head { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap;
    margin-bottom: var(--space-4); }
  .v3-vitals-eyebrow { text-transform: uppercase; letter-spacing: var(--tracking-wide);
    font-size: var(--text-xs); color: var(--color-faint); }
  .v3-vitals-eyebrow .v3-muted { text-transform: none; letter-spacing: 0; }
  .v3-vitals-partial { font-size: var(--text-xs); color: var(--color-warning); font-weight: var(--weight-semi); }
  .v3-vitals-detail { margin-left: auto; background: none; border: 0; cursor: pointer;
    color: var(--color-accent); font-size: var(--text-xs); font-weight: var(--weight-semi);
    font-family: var(--font-sans); padding: 0; }
  /* Subgrid, so the three vitals share row bands and their figures share a baseline.
     Health and Safe to scale are 32px numbers; Growth quality is a 15px phrase, and the
     three were only aligned at the TOP of their boxes — a 12px baseline step across one
     row, which is enough to make the third column look like it belongs to another block. */
  .v3-vitals-row { display: grid; grid-template-columns: repeat(3, 1fr);
                   grid-template-rows: auto auto auto; gap: var(--space-5); }
  .v3-vital { display: grid; grid-template-rows: subgrid; grid-row: span 3;
              align-items: baseline; align-content: start; }
  .v3-vital + .v3-vital { border-left: 1px solid var(--color-line); padding-left: var(--space-5); }
  .v3-vital-lab { display: flex; align-items: center; gap: var(--space-1);
    font-size: var(--text-xs); color: var(--color-muted); margin-bottom: var(--space-2); }
  .v3-vital-val { font-family: var(--font-mono); font-size: var(--text-2xl); line-height: 1;
    font-variant-numeric: tabular-nums; }
  .v3-vital-of { font-size: var(--text-sm); color: var(--color-faint); }
  .v3-vital-band { font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-1); }
  .v3-vital-word { font-family: var(--font-sans); font-size: var(--text-base, 15px);
    font-weight: var(--weight-semi); line-height: 1.2; }
  /* A drawn 5-step meter. ★★★★★ depended on the font carrying U+2605 and could not take
     the palette; this scales with the type and inherits the score's colour. */
  .v3-rate { display: inline-flex; gap: 2px; align-items: center; }
  .v3-rate i { width: 5px; height: 12px; border-radius: var(--radius-sm);
    background: var(--color-line-strong); display: block; }

  /* The separator belongs to the clause before it. On a narrow column the goal takes its
     own line and the middot goes with the line it was separating, rather than leading. */
  .v3-pace-goal { white-space: nowrap; }
  @media (max-width: 560px) {
    .v3-pace-goal { display: block; white-space: normal; }
    .v3-pace-goal .v3-sep { display: none; }
  }

  .v3-vitals-plain { margin-top: var(--space-4); padding-top: var(--space-3);
    border-top: 1px solid var(--color-line); font-size: var(--text-sm);
    color: var(--color-muted); line-height: 1.55; }
  @media (max-width: 680px) {
    .v3-vitals-row { grid-template-columns: 1fr; gap: var(--space-3); }
    .v3-vital + .v3-vital { border-left: 0; padding-left: 0;
      border-top: 1px solid var(--color-line); padding-top: var(--space-3); }
  }

  /* A table wider than the phone scrolls, but nothing said so: 758px of columns inside a
     375px viewport with no edge treatment reads as a table that simply ends. A fade on the
     right edge of the scroller is the conventional cue, and it disappears once scrolled. */
  /* A table wider than the phone scrolls, but nothing said so: 758px of columns inside a
     375px viewport with no edge treatment reads as a table that simply ends. This is the
     background-attachment technique rather than a pseudo-element, because the wrappers are
     inline-styled by the components and have nowhere to hang one: two panel-coloured covers
     pinned to the content (`local`) and two shadows pinned to the box (`scroll`), so a
     shadow shows only on the side that still has columns hidden and fades out at each end.
     No JS, no markup change, and it self-disables when the table fits. */
  .card > div[style*="overflow"], .v3-main .tbl-scroll, .v3-main table {
    background:
      linear-gradient(to right, var(--color-panel) 40%, transparent) left   / 28px 100% no-repeat local,
      linear-gradient(to left,  var(--color-panel) 40%, transparent) right  / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0   50%, var(--color-scroll-cue), transparent) left  / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, var(--color-scroll-cue), transparent) right / 12px 100% no-repeat scroll;
  }
  @media (max-width: 640px) { .v3-thread { font-size: var(--text-xs); } }
  .v3-page-head-row > div:first-child { flex: 1 1 260px; min-width: 0; }
  .v3-period { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); flex-wrap: wrap; }
  .v3-period select, .v3-period input {
    font-family: var(--font-sans); font-size: var(--text-sm); min-height: 44px; padding: 0 10px;
    border: 1px solid var(--border-default); color: var(--text-primary);
    background-color: var(--bg-card);   /* see .toolbar select — the shorthand kills the caret */
  }
  .v3-period-range { display: flex; align-items: center; gap: 6px; }

  /* "What is happening" — the why block on Today */
  .v3-why { border-top: 1px solid var(--border-subtle); padding-top: 14px; }
  .v3-why-p { font-size: var(--text-base); line-height: 1.6; margin: 0 0 6px; max-width: 70ch; }
  .v3-why-list { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: var(--text-sm); color: var(--text-secondary); }
  .v3-why-list li { display: grid; grid-template-columns: 3rem 1fr; gap: 8px; }
