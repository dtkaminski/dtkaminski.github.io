<style>
  /* ─────────────────────────────────────────────────────────────────────────
     OPERATOR INTELLIGENCE — DESIGN SYSTEM (Phase 1)
     Tokens first. Every component below uses these — no magic numbers.
     ───────────────────────────────────────────────────────────────────────── */
  :root {
    /* Spacing scale (multiples of 4) */
    --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
    --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 48px;

    /* Radius scale */
    /* Containers are square (--radius-none); buttons and inputs take 4px (--radius-md). */
    --r-sm: var(--radius-md); --r-md: var(--radius-none); --r-lg: var(--radius-none); --r-full: 999px;

    /* Type scale */
    /* Aliases, now pointing at the one ladder. They used to carry their own values
       (23/16/14/13/11.5/10.5px), which is how the product ended up running two type
       scales at once and setting its most-used text on a half pixel. */
    --t-display: var(--text-xl); --t-h2: var(--text-base); --t-h3: var(--text-base);
    --t-body: var(--text-sm);    --t-meta: var(--text-xs);  --t-micro: var(--text-xs);

    /* Surface — "ink" dark: a lifted cool-slate base (NOT pure black) with clear
       elevation layers, so cards read as surfaces, not console output. */
    --bg-app:        var(--color-surface);
    --bg-card:       var(--color-panel);
    --bg-card-hover: var(--color-panel-hover);
    --bg-input:      var(--color-input);
    /* Legacy name from the dark theme, still used by nine input and control styles in
       greta-app.jsx. It was the only --bg-* alias never mapped, so those backgrounds
       resolved to nothing and computed to transparent. Inputs, so it takes the input
       colour the design system already defines. */
    --bg-base:       var(--color-input);
    --bg-elevated:   var(--color-panel);
    /* Same oversight, and this one was visible: seven uses in greta-app.jsx, six
       falling back to the panel colour and one -- the modal at greta-app.jsx:2874 --
       to #15151c, a leftover from the dark theme. Undefined, that modal painted
       near-black and then set dark ink text on it. */
    --surface-1:     var(--color-panel);
    --surface-2:     var(--color-panel);

    /* Border — a touch more present so layers separate cleanly */
    --border-subtle:  var(--color-line);
    --border-default: var(--color-line-strong);

    /* Text — softened top end (no pure white) for a calmer, premium contrast */
    --text-primary:   var(--color-ink);
    --text-secondary: var(--color-secondary);
    --text-muted:     var(--color-muted);
    --text-faint:     var(--color-faint);

    /* Semantic — slightly desaturated so red/green read as signal, not neon */
    --good:    var(--color-success);
    --warn:    var(--color-warning);
    --bad:     var(--color-danger);
    --accent:  var(--color-accent);
    --accent-soft: var(--color-accent-wash);
    --accent-hover: var(--color-accent-hover);

    /* Status surfaces (tinted backgrounds for pills/banners) */
    --good-bg:   var(--color-success-wash);
    --warn-bg:   var(--color-warning-wash);
    --bad-bg:    var(--color-danger-wash);
    --accent-bg: var(--color-accent-wash);

    /* Heatmap scale (IG cadence calendar) — poor→strong engagement */
    --heat-empty: var(--color-sunken); --heat-none: #E3E1DC; --heat-low: #F0C9AE;
    --heat-mid: #E8D49B; --heat-high: #A8D8BE; --heat-ink: var(--color-muted);

    /* Shadows — softer + slightly larger spread for a lifted, premium feel */
    --shadow-sm: var(--shadow-panel);
    --shadow-md: var(--shadow-raised);
    --shadow-lg: var(--shadow-raised);

    /* Motion */
    --motion-fast: 120ms ease;
    --motion-base: 180ms ease;
    --appbar-h: 57px;
    --bg-chrome: var(--color-chrome);
  }

  /* ── One theme ─────────────────────────────────────────────────────────
     Phase 2 decision 3 (approved 2026-09-23): the app renders in the
     design-tokens.css palette, light only. The old dark values and the
     data-theme toggle are gone; every colour above resolves to a token. */
  html { color-scheme: light; }
  /* Recharts draws SVG attributes, which cannot read var() — its generated
     classes are styled here instead so charts follow the token palette. */
  .recharts-cartesian-grid line { stroke: var(--color-line); }
  .recharts-text, .recharts-cartesian-axis-tick-value tspan { fill: var(--color-muted); }
  /* Numbers in mono, including the ones inside charts (2026-09-29). The house rule is
     mono for anything countable, and it was being applied to figures written in JSX but
     not to axis ticks, tooltips or bar labels, which Recharts renders itself. Measured on
     the profit page: 82 of 89 numbers on screen were falling back to the sans stack. An
     axis of proportional digits is the difference between a chart that looks plotted and
     one that looks typed - the columns do not line up, and 1 and 7 change width. */
  /* Axis ticks are NOT blanket-mono: a category axis holds words. "United Kingdom",
     "Ireland" and "Orders" came out in a typewriter face when this selector was
     unconditional. tagFigures() tags numeric tspans instead; only the tooltip value,
     which is always a figure, is set here. */
  .recharts-tooltip-item-value, .recharts-label-list text {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .recharts-legend-item-text, .recharts-tooltip-item-name { font-family: var(--font-sans); }

  /* Figures line up (2026-09-29). The house rule is mono for anything countable, but 1,684
     numbers across the deep pages were rendering in the sans stack - mostly table cells,
     where CSS cannot tell "£1,317" from "Gold Charm Necklace" and blanket mono would set
     product names in a typewriter face.
     Two rules instead of one bad one:
       1. tabular-nums everywhere. DM Sans carries proportional digits by default, so a 1
          is narrower than a 7 and a column of money does not line up even when it is right
          aligned. This is the fix for the column, and it costs nothing.
       2. real mono on figures only, tagged at runtime by tagFigures() in greta-app.jsx.
     Class selectors were tried first and were wrong: .card .val holds the "Top seller"
     value, so the product name "the mega" came out in a typewriter face. Only .oi-num
     inspects the text, so only .oi-num gets the typeface. */
  /* <b> and <strong> default to `bolder`, which is RELATIVE: inside a 700 heading the
     browser resolves it to 900, and the loaded DM Sans stops at 700 - so emphasis inside
     a bold line was asking for a weight that does not exist, same as --weight-heavy was.
     Measured: 8 elements computing to 900 across the sixteen destinations. */
  b, strong { font-weight: var(--weight-bold); }

  /* Small print that is a sentence, not a label. Same size and colour as .micro,
     sentence case, and without the tracking that spaces caps out. */
  .fine {
    font-family: var(--font-sans); font-size: var(--text-xs);
    line-height: var(--leading-body); color: var(--color-muted);
    letter-spacing: 0; text-transform: none; font-weight: var(--weight-normal);
    max-width: var(--measure);
  }

  /* An eyebrow can be uppercase; the qualifier trailing it is a phrase, not a label.
     "BUSINESS VITALS · LAST 30 DAYS · INDEPENDENT OF THE DATE PICKER" was one caps run. */
  .v3-vitals-eyebrow .v3-muted { text-transform: none; letter-spacing: 0; }

  /* One caret, drawn, instead of sixteen screens of operating system. */
  select {
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    background-image: var(--caret-down);
    background-repeat: no-repeat;
    background-position: right var(--space-3) center;
    padding-right: var(--space-8);
  }
  select::-ms-expand { display: none; }

  .v3-root, .card, table { font-variant-numeric: tabular-nums; }
  .oi-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .recharts-cartesian-axis-line, .recharts-cartesian-axis-tick-line { stroke: var(--color-line-strong); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    /* Declared, because it was not. Anything that did not set its own size inherited the
       user agent's 16px, which is not a rung on this ladder - that is why the largest
       green figure on Profit came out a size above the heading beside it. */
    font-size: var(--text-sm);
    background: var(--bg-app); color: var(--text-primary);
    min-height: 100vh; font-feature-settings: 'ss01','cv11';
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: var(--r-sm); }
  ::-webkit-scrollbar-thumb:hover { background: var(--color-muted); }

  button, .btn, .btn-primary, .btn-ghost, input, select, textarea, .v3-btn, .v3-nav-search, .v3-nav-item {
    border-radius: var(--radius-md);
  }
  /* Form controls do not inherit font. Enough of the app's buttons set their own that
     nobody noticed the ones which do not - Ask's primary button among them - were
     rendering in the browser's form-control face at 13.333px. Lowest possible
     specificity, so every existing rule still wins. */
  button, input, select, textarea, optgroup {
    font-family: inherit; font-size: var(--text-sm); letter-spacing: inherit;
  }

  /* ── App chrome ──────────────────────────────────────────────────────── */
  .appbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(245,242,237,0.88); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .appbar-inner {
    max-width: 1320px; margin: 0 auto;
    padding: var(--s-3) var(--s-6);
    display: flex; align-items: center; gap: var(--s-4);
  }
  .brand { display:flex; align-items:center; gap: var(--s-3); }
  .brand-mark {
    width: 28px; height: 28px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { width: 100%; height: 100%; display: block; }
  .brand-name {
    font-size: var(--text-lg); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight);
    text-transform: lowercase; color: var(--text-primary);
  }
  .brand-sub {
    font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--text-muted);
    margin-top: 1px; letter-spacing: var(--tracking-wide);
  }
  .workspace-chip {
    display: inline-flex; align-items: center; gap: var(--s-2);
    padding: 5px 11px; border-radius: var(--r-md);
    background: var(--bg-card); border: 1px solid var(--border-default);
    font-size: var(--text-sm); font-weight: var(--weight-semi); color: var(--text-secondary);
    cursor: pointer; transition: background var(--motion-fast);
  }
  .workspace-chip:hover { background: var(--bg-card-hover); }
  .workspace-chip .dot {
    width: 6px; height: 6px; border-radius: var(--r-full); background: var(--good);
    box-shadow: 0 0 6px rgba(74,222,128,.6);
  }
  .appbar-spacer { flex: 1; }
  .env-badge {
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
    padding: 3px 8px; border-radius: var(--r-sm);
    background: var(--warn-bg); color: var(--warn);
    border: 1px solid rgba(245,181,68,.25);
  }

  /* ── Page layout ────────────────────────────────────────────────────── */
  .wrap { max-width: 1320px; margin: 0 auto; padding: var(--s-6) var(--s-6) var(--s-8); }
  .row { display: flex; flex-wrap: wrap; gap: var(--s-4); }

  /* ── Tabs: two-level (section + subTab) ─────────────────────────────── */
  .tabnav { display: flex; gap: var(--s-1); align-items: center; }
  .tabnav .tab {
    padding: 7px 14px; border-radius: var(--r-md); cursor: pointer;
    font-size: var(--text-sm); font-weight: var(--weight-semi); color: var(--text-secondary);
    background: transparent; border: 1px solid transparent;
    transition: all var(--motion-fast);
  }
  .tabnav .tab:hover { color: var(--text-primary); background: var(--bg-card); }
  .tabnav .tab.active {
    color: var(--text-primary); background: var(--bg-card);
    border-color: var(--border-default);
  }
  .subnav {
    display: flex; gap: var(--s-1); align-items: center;
    padding: var(--s-3) 0 var(--s-2);
    border-bottom: 1px solid var(--border-subtle); margin-bottom: var(--s-5);
    flex-wrap: wrap;
  }
  .subnav .subtab {
    padding: 4px 10px; border-radius: var(--r-sm); cursor: pointer;
    font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-muted);
    transition: color var(--motion-fast);
  }
  .subnav .subtab:hover { color: var(--text-secondary); }
  .subnav .subtab.active {
    color: var(--accent);
    box-shadow: inset 0 -2px 0 var(--accent);
    border-radius: 0; padding-bottom: 6px;
  }

  /* ── Segmented control (e.g. 7/30/60/90 day toggle) ──────────────────── */
  .seg {
    display: inline-flex; background: var(--bg-card); padding: 3px;
    border: 1px solid var(--border-subtle); border-radius: var(--r-md);
  }
  .seg button {
    background: transparent; border: 0; color: var(--text-muted);
    padding: 5px 11px; cursor: pointer; font-size: var(--text-sm); font-weight: var(--weight-semi);
    border-radius: var(--r-sm); transition: all var(--motion-fast);
  }
  .seg button:hover { color: var(--text-secondary); }
  .seg button.on { background: var(--bg-elevated); color: var(--text-primary); }

  /* ── Mobile responsiveness (UX Phase 4) — kill horizontal overflow ──────── */
  @media (max-width: 760px) {
    html, body { overflow-x: hidden; max-width: 100vw; }
    /* App-bar controls (period select + custom date range) wrap to new lines
       instead of pushing the header — and its bits stay reachable. */
    .appbar-inner { flex-wrap: wrap; row-gap: 6px; }
    .appbar-spacer { flex-basis: 100%; height: 0; }
    /* Section tabs become a horizontally-swipeable bar rather than overflowing. */
    .tabnav { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
    /* Segmented controls wrap; data tables scroll inside their own card. */
    .seg { flex-wrap: wrap; max-width: 100%; }
    table { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .card, .page { max-width: 100%; box-sizing: border-box; }
    /* Multi-column rows stack on mobile (and stop pushing the page wide). */
    .row { flex-wrap: wrap; }
    .card { overflow-wrap: anywhere; }
  }

  /* ── Cards — neutral by default, no coloured left-borders ────────────── */
  .card {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: var(--r-lg); padding: var(--s-5);
    transition: border-color var(--motion-fast);
  }
  .card-section-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: var(--s-3);
  }
  /* Use .card.alert-{kind} ONLY for genuine alert/status banners — not for general grouping */
  .card.alert-bad   { border-left: 3px solid var(--bad);    border-left-width: 3px; padding-left: calc(var(--s-5) - 3px); }
  .card.alert-warn  { border-left: 3px solid var(--warn);   border-left-width: 3px; padding-left: calc(var(--s-5) - 3px); }
  .card.alert-good  { border-left: 3px solid var(--good);   border-left-width: 3px; padding-left: calc(var(--s-5) - 3px); }
  .card.alert-info  { border-left: 3px solid var(--accent); border-left-width: 3px; padding-left: calc(var(--s-5) - 3px); }

  /* ── Weekly board ────────────────────────────────────────────────────── */
  .board-grid {
    display: grid; gap: var(--s-3);
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .board-card { padding: var(--s-4) var(--s-4) var(--s-4) calc(var(--s-4) - 3px); }
  .board-commentary { padding-left: calc(var(--s-5) - 3px); }
  .board-commentary-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-5); }
  @media (max-width: 760px) { .board-commentary-cols { grid-template-columns: 1fr; gap: var(--s-4); } }
  .board-comm-head { font-size: var(--text-sm); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); margin-bottom: 8px; }
  .board-comm-line {
    font-size: var(--text-sm); line-height: 1.5; color: var(--text-secondary);
    padding: 5px 0; border-top: 1px solid var(--border-subtle);
  }
  .board-comm-line:first-of-type { border-top: none; }
  .board-comm-line.muted { color: var(--text-faint); }
  .board-nav-btn {
    cursor: pointer; background: var(--bg-card); color: var(--text-secondary);
    border: 1px solid var(--border-default); border-radius: var(--r-sm);
    padding: 7px 12px; font-size: var(--text-sm); font-weight: var(--weight-semi);
    transition: color var(--motion-fast), border-color var(--motion-fast);
  }
  .board-nav-btn:hover:not(:disabled) { color: var(--text-primary); border-color: var(--accent); }
  .board-nav-btn:disabled { opacity: .4; cursor: default; }
  @media print {
    .app-bar, .sub-nav, .period-bar, .board-nav-btn, textarea, input { display: none !important; }
    .board-card, .card { break-inside: avoid; }
    body { background: #fff; }
  }

  /* ── KPI ─────────────────────────────────────────────────────────────── */
  .kpi { flex: 1 1 180px; position: relative; cursor: default; }
  /* A KPI is a figure, not a container: no box, a hairline above and the grid's whitespace
     between. Boxed tiles inside a boxed panel inside the page sheet was three nested frames
     around nine numbers (CLAUDE.md: whitespace + a top rule over cards). */
  .card.kpi { background: transparent; border: 0; border-top: 1px solid var(--color-line);
              border-radius: var(--radius-none); padding: var(--s-3) 0 var(--s-2); }
  .card.kpi:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
  .kpi.has-pop { cursor: help; }
  .kpi .label {
    font-size: var(--t-meta); color: var(--text-muted);
    letter-spacing: var(--tracking-wide); font-weight: var(--weight-medium);
    display: flex; align-items: center; gap: var(--s-2);
  }
  .kpi .label .info-dot {
    width: 5px; height: 5px; border-radius: var(--r-full);
    background: var(--text-faint); opacity: 0; transition: opacity var(--motion-fast);
  }
  .kpi.has-pop:hover .label .info-dot { opacity: 1; background: var(--accent); }
  .kpi .val {
    font-size: var(--text-xl); font-weight: var(--weight-semi); margin-top: var(--s-2);
    letter-spacing: var(--tracking-snug); line-height: 1.1;
  }
  .kpi .sub {
    font-size: var(--t-meta); margin-top: var(--s-1);
    color: var(--text-muted); font-weight: var(--weight-medium);
  }
  .kpi .delta { font-size: var(--text-xs); font-weight: var(--weight-semi); margin-left: var(--s-2); vertical-align: 2px; }
  /* Hover popover contains sparkline AND agent explanation — no more always-on commentary */
  .kpi-pop {
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 0;
    background: var(--bg-elevated); border: 1px solid var(--border-default);
    border-radius: var(--r-md); padding: var(--s-3);
    opacity: 0; pointer-events: none;
    /* delay the HIDE by 0.18s so the cursor has time to travel onto the popout */
    transition: opacity var(--motion-fast) 0.18s, visibility 0s linear 0.36s;
    z-index: 100; box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; gap: var(--s-3);
    /* No min-width: a 300px floor on a narrower right-hand card hung the (invisible) popout
       off the page and gave every Profit & sales visit 27px of sideways scroll. The card's
       own width is the popout's width. */
    visibility: hidden;
  }
  /* Invisible bridge over the seam so moving card→popout never drops :hover */
  .kpi-pop::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 12px; }
  .kpi:hover .kpi-pop, .kpi:focus-within .kpi-pop { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; } /* show instantly; focus = tap on touch */
  .kpi-pop .head {
    font-size: var(--text-xs); color: var(--text-muted); text-align: center;
    padding: 0 0 2px; letter-spacing: var(--tracking-wide); text-transform: uppercase;
  }
  .kpi-pop .explainer {
    font-size: var(--t-meta); line-height: 1.5;
    border-top: 1px solid var(--border-subtle); padding-top: var(--s-3);
  }
  .kpi-pop .explainer:first-child { border-top: 0; padding-top: 0; }

  /* ── Overview tile hover popover (.go-pop) — detail + optional sparkline, mirrors .kpi-pop ── */
  .go-tile { position: relative; }
  .go-tile .go-dot { opacity: 0; transition: opacity var(--motion-fast); }
  .go-tile:hover .go-dot { opacity: 1; }
  .go-pop {
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px;
    background: var(--bg-elevated); border: 1px solid var(--border-default);
    border-radius: var(--r-md); padding: var(--s-3);
    opacity: 0; pointer-events: none;
    transition: opacity var(--motion-fast) 0.18s;
    z-index: 120; box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; gap: var(--s-2); min-width: 260px;
  }
  /* invisible bridge over the seam so card→popout never drops :hover */
  .go-pop::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 12px; }
  .go-tile:hover .go-pop { opacity: 1; pointer-events: auto; transition-delay: 0s; }
  .go-pop .go-head { font-size: var(--text-xs); color: var(--text-muted); letter-spacing: var(--tracking-wide); text-transform: uppercase; }
  .go-pop .go-row { font-size: var(--t-meta); color: var(--text-secondary); line-height: 1.5; display: flex; justify-content: space-between; gap: 12px; }
  .go-pop .go-row b { color: var(--text-primary); font-family: var(--font-mono); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
  .go-pop .go-ask { font-size: var(--t-meta); color: var(--accent); cursor: pointer; margin-top: 2px; font-weight: var(--weight-medium); }
  .go-pop .go-ask:hover { text-decoration: underline; }
  .kpi-pop .agent {
    display: inline-block; font-size: var(--text-xs); font-weight: var(--weight-bold);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    color: var(--accent); background: var(--accent-bg);
    padding: 2px 7px; border-radius: var(--r-full); margin-bottom: var(--s-2);
  }
  .kpi-pop .obs { color: var(--text-secondary); }
  .kpi-pop .imp { color: var(--text-muted); margin-top: var(--s-1); }
  .kpi-pop .imp::before { content: '→ '; color: var(--accent); font-weight: var(--weight-bold); }
  .txt-link { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  .txt-link:hover { border-bottom-style: solid; background: rgba(139,92,246,0.08); }

  /* ── Type ────────────────────────────────────────────────────────────── */
  h1 { font-size: var(--t-display); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); }
  h2 { font-size: var(--t-h2); font-weight: var(--weight-semi); margin-bottom: var(--s-3); letter-spacing: var(--tracking-snug); }
  .muted { color: var(--text-muted); font-size: var(--t-body); }
  .meta { color: var(--text-muted); font-size: var(--t-meta); }
  .micro { color: var(--text-faint); font-size: var(--t-micro); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-weight: var(--weight-semi); }

  /* ── Pills ───────────────────────────────────────────────────────────── */
  .pill {
    display: inline-block; font-size: var(--t-meta); padding: 2px 9px;
    border-radius: var(--r-full); font-weight: var(--weight-semi); letter-spacing: var(--tracking-wide);
  }
  .pill.green { background: var(--good-bg); color: var(--good); }
  .pill.amber { background: var(--warn-bg); color: var(--warn); }
  .pill.red   { background: var(--bad-bg);  color: var(--bad);  }
  .pill.grey  { background: var(--border-subtle); color: var(--text-muted); }
  .pill.accent{ background: var(--accent-bg); color: var(--accent); }

  /* ── Grids & creative tiles ──────────────────────────────────────────── */
  .grid { display: grid; gap: var(--s-4); }
  .cg { grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
  .creative {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: var(--r-md); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .creative .thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #1a1a22; display: block; }
  .creative .body { padding: var(--s-3); flex: 1; display: flex; flex-direction: column; gap: var(--s-2); }
  .creative .name { font-size: var(--t-body); font-weight: var(--weight-semi); line-height: 1.25; }
  .creative .copy { font-size: var(--t-meta); color: var(--text-muted); line-height: 1.35; max-height: 48px; overflow: hidden; }

  /* ── Tables ──────────────────────────────────────────────────────────── */
  .mrow { display: flex; justify-content: space-between; font-size: var(--t-body); }
  .mrow .k { color: var(--text-muted); } .mrow .v { font-weight: var(--weight-semi); }
  /* ── Tables — one professional standard for all 40+ data tables ───────────
     Numbers right + tabular figures so digits align in a column; text left.
     Row label (first col) carries primary weight; body cells sit one step back
     for a clean hierarchy. Header is a quiet uppercase micro-label over a firm
     divider. Hover is theme-aware (token, not a white overlay). */
  table { width: 100%; border-collapse: collapse; font-size: var(--t-body); }
  th, td {
    text-align: right; padding: 9px var(--s-3);
    border-bottom: 1px solid var(--border-subtle);
    vertical-align: middle;
  }
  td { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  td:first-child { color: var(--text-primary); font-weight: var(--weight-semi); }
  th {
    color: var(--text-muted); font-weight: var(--weight-semi); font-size: var(--text-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase; white-space: nowrap;
    padding-bottom: var(--s-3); padding-top: 0; vertical-align: bottom;
    border-bottom: 1px solid var(--border-default);
  }
  /* Alignment utilities for the few columns that break the numeric default. */
  th.tl, td.tl { text-align: left; }
  th.tr, td.tr { text-align: right; }
  th.tc, td.tc { text-align: center; }
  td.tnum { font-variant-numeric: tabular-nums; }
  tbody tr { transition: background var(--motion-fast); }
  tbody tr:hover { background: var(--bg-card-hover); }
  tbody tr:last-child td { border-bottom: 0; }
  /* Opt-in sticky header for tall scroll-bodied tables. */
  table.sticky thead th { position: sticky; top: 0; z-index: 1; background: var(--bg-card); }
  td code { font-size: var(--text-xs); color: var(--text-muted); background: var(--bg-app); padding: 1px 5px; border-radius: var(--r-sm); }

  /* ── Recharts global polish — quieter grid, cleaner tooltips ─────────── */
  .recharts-cartesian-grid-horizontal line,
  .recharts-cartesian-grid-vertical line { stroke: var(--border-subtle) !important; }
  .recharts-default-tooltip {
    background: var(--bg-elevated) !important;
    border: 1px solid var(--border-default) !important;
    border-radius: var(--r-md) !important;
    box-shadow: var(--shadow-md) !important;
    padding: var(--s-2) var(--s-3) !important;
  }
  .recharts-tooltip-label { color: var(--text-muted) !important; font-size: var(--text-xs) !important; margin-bottom: 4px !important; }
  .recharts-tooltip-item { color: var(--text-primary) !important; font-size: var(--text-sm) !important; font-weight: var(--weight-semi) !important; }
  .recharts-legend-item-text { color: var(--text-secondary) !important; font-size: var(--text-xs) !important; }

  /* ── Notes / callouts ────────────────────────────────────────────────── */
  .note {
    background: var(--bg-elevated); border-left: 3px solid var(--accent);
    padding: var(--s-3) var(--s-4); border-radius: 0 var(--r-md) var(--r-md) 0;
    font-size: var(--t-body); color: var(--text-secondary); line-height: 1.55;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Status badges — named commercial states (one vocabulary) ─────────── */
  .sbadge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); line-height: 1.45;
    padding: 3px 9px 3px 8px; border-radius: var(--r-full); white-space: nowrap;
  }
  .sbadge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: currentColor; }
  .sbadge.good { color: var(--good);   background: var(--good-bg); }
  .sbadge.warn { color: var(--warn);   background: var(--warn-bg); }
  .sbadge.bad  { color: var(--bad);    background: var(--bad-bg); }
  .sbadge.info { color: var(--accent); background: var(--accent-bg); }
  .sbadge.mut  { color: var(--text-muted); background: var(--border-subtle); }

  /* ── Icons — single line-icon family, inherits colour, themes for free ── */
  .oi-ic { display: inline-block; vertical-align: middle; flex-shrink: 0; }

  /* ── Toasts — lightweight, premium action confirmations ───────────────── */
  .toast-host {
    position: fixed; right: 18px; bottom: 18px; z-index: 1000;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none; max-width: 340px;
  }
  .toast {
    pointer-events: auto; display: flex; align-items: flex-start; gap: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-default);
    border-left: 3px solid var(--accent); border-radius: var(--r-md);
    padding: 11px 13px; box-shadow: var(--shadow-lg); color: var(--text-primary); font-size: var(--text-sm);
    animation: toast-in 220ms cubic-bezier(.2,.8,.2,1);
  }
  .toast.good { border-left-color: var(--good); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.bad  { border-left-color: var(--bad); }
  .toast .t-title { font-weight: var(--weight-semi); }
  .toast .t-body { color: var(--text-secondary); font-size: var(--text-sm); margin-top: 1px; line-height: 1.45; }
  .toast .t-ic { color: var(--accent); margin-top: 1px; }
  .toast.good .t-ic { color: var(--good); } .toast.bad .t-ic { color: var(--bad); } .toast.warn .t-ic { color: var(--warn); }
  .toast .t-x { margin-left: 4px; background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: var(--text-base); line-height: 1; padding: 0 2px; }
  .toast .t-x:hover { color: var(--text-secondary); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (max-width: 760px) { .toast-host { left: 12px; right: 12px; bottom: 12px; max-width: none; } }

  /* ── App shell — decision-led left rail ──────────────────────────────── */
  .app-shell { display: flex; align-items: flex-start; max-width: 1800px; margin: 0 auto; }
  .sidebar {
    position: sticky; top: var(--appbar-h); align-self: flex-start;
    width: 214px; flex-shrink: 0; height: calc(100vh - var(--appbar-h));
    overflow-y: auto; padding: 16px 12px 24px; border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; gap: 2px;
  }
  .nav-cmd {
    display: flex; align-items: center; gap: 9px; margin: 0 2px 12px; padding: 8px 11px;
    border: 1px solid var(--border-default); border-radius: var(--r-md); background: var(--bg-card);
    color: var(--text-muted); font-size: var(--text-sm); cursor: pointer; font-family: inherit; transition: all var(--motion-fast);
  }
  .nav-cmd:hover { color: var(--text-secondary); border-color: var(--text-faint); }
  .nav-cmd kbd { margin-left: auto; font-size: var(--text-xs); background: var(--bg-app); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md); padding: 1px 5px; color: var(--text-faint); font-family: inherit; }
  .nav-label { font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
    color: var(--text-faint); padding: 10px 11px 5px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 8px 11px; border-radius: var(--r-md);
    font-size: var(--text-sm); font-weight: var(--weight-semi); color: var(--text-secondary); cursor: pointer;
    border: 1px solid transparent; transition: all var(--motion-fast); white-space: nowrap;
  }
  .nav-item .oi-ic { color: var(--text-faint); transition: color var(--motion-fast); }
  .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
  .nav-item:hover .oi-ic { color: var(--text-secondary); }
  .nav-item.active { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-default); font-weight: var(--weight-semi); }
  .nav-item.active .oi-ic { color: var(--accent); }
  .app-main { flex: 1; min-width: 0; overflow-x: clip; }
  .app-main .wrap { max-width: none; }
  /* ── Global plan rail (persistent targets panel, right side) ── */
  .plan-rail {
    position: sticky; top: var(--appbar-h); align-self: flex-start;
    width: 300px; flex-shrink: 0; height: calc(100vh - var(--appbar-h));
    overflow-y: auto; padding: 16px 4px 28px; margin-left: 20px;
    border-left: 1px solid var(--border-subtle);
  }
  .plan-rail:empty { display: none; }
  @media (max-width: 1200px) { .plan-rail { display: none; } }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex-shrink: 0;
    border-radius: var(--radius-md); background: var(--bg-card); border: 1px solid var(--border-default);
    color: var(--text-secondary); cursor: pointer; transition: all var(--motion-fast);
  }
  .icon-btn:hover { color: var(--text-primary); border-color: var(--text-faint); }
  .mobile-secnav { display: none; }
  /* Mobile: fixed bottom tab bar (founder quick-nav); ⌘K/More reaches the rest. */
  .mobile-botnav { display: none; }
  @media (max-width: 760px) {
    .app-shell { display: block; }
    .sidebar { display: none; }
    .mobile-botnav {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      background: var(--bg-elevated); border-top: 1px solid var(--border-default);
      box-shadow: 0 -3px 14px rgba(0,0,0,0.18);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    }
    .mb-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 5px 2px; background: none; border: none; color: var(--text-muted);
      font-size: var(--text-xs); font-weight: var(--weight-semi); font-family: inherit; cursor: pointer; min-width: 0; }
    .mb-item span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mb-item.active { color: var(--accent); }
    body { padding-bottom: 62px; }
  }

  /* ── Command menu (⌘K) ───────────────────────────────────────────────── */
  .cmd-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1100;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; backdrop-filter: blur(2px); }
  .cmd-box { width: min(560px, 92vw); background: var(--bg-elevated); border: 1px solid var(--border-default);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg); overflow: hidden; }
  .cmd-input { width: 100%; border: none; border-bottom: 1px solid var(--border-subtle); background: transparent;
    color: var(--text-primary); font-size: var(--text-base); padding: 15px 17px; outline: none; font-family: inherit; }
  .cmd-input::placeholder { color: var(--text-faint); }
  .cmd-list { max-height: 340px; overflow-y: auto; padding: 6px; }
  .cmd-row { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--r-md);
    cursor: pointer; color: var(--text-secondary); font-size: var(--text-sm); }
  .cmd-row .oi-ic { color: var(--text-faint); }
  .cmd-row.sel { background: var(--bg-card); color: var(--text-primary); }
  .cmd-row.sel .oi-ic { color: var(--accent); }
  .cmd-row .cmd-sub { color: var(--text-faint); font-size: var(--text-xs); margin-left: auto; }
  .cmd-empty { padding: 20px; text-align: center; color: var(--text-faint); font-size: var(--text-sm); }

  /* ── Insight action row — operator recommendations, not blog text ─────── */
  .insight-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
  .ia-btn { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: var(--weight-semi); font-family: inherit;
    padding: 5px 10px; border-radius: var(--r-md); border: 1px solid var(--border-default); background: var(--bg-card);
    color: var(--text-secondary); cursor: pointer; transition: all var(--motion-fast); }
  .ia-btn:hover { color: var(--text-primary); border-color: var(--text-faint); background: var(--bg-card-hover); }
  .ia-btn .oi-ic { color: var(--text-faint); }
  .ia-btn:hover .oi-ic { color: var(--text-secondary); }
  .ia-btn.primary { color: var(--accent); border-color: var(--accent-soft); }
  .ia-btn.primary .oi-ic { color: var(--accent); }
  .ia-dismissed { display: flex; align-items: center; gap: 9px; color: var(--text-muted); font-size: var(--text-sm); }
  .ia-dismissed button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: var(--text-sm); font-family: inherit; font-weight: var(--weight-semi); margin-left: auto; }
  .insight.ia-collapsed { padding: 12px 16px; }

  /* ── Evidence drawer — slide-in trust panel ───────────────────────────── */
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1090; animation: fade-in 160ms ease; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 94vw); background: var(--bg-card);
    border-left: 1px solid var(--border-default); box-shadow: var(--shadow-lg); z-index: 1091;
    display: flex; flex-direction: column; animation: drawer-in 220ms cubic-bezier(.2,.8,.2,1); }
  @keyframes drawer-in { from { transform: translateX(24px); opacity: .5; } to { transform: none; opacity: 1; } }
  .drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--border-subtle); }
  .drawer-head h3 { margin: 0; font-size: var(--text-base); font-weight: var(--weight-bold); line-height: 1.4; }
  .drawer-x { margin-left: auto; background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: var(--text-lg); line-height: 1; padding: 0 2px; }
  .drawer-x:hover { color: var(--text-secondary); }
  .drawer-body { padding: 16px 20px 28px; overflow-y: auto; }
  .drawer-sec { margin-bottom: 16px; }
  .drawer-sec .lbl { font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px; }
  .drawer-sec .bd { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.55; }
  .drawer-sec ul { margin: 0; padding-left: 17px; } .drawer-sec li { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.55; margin-bottom: 4px; }
  .drawer-src { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-muted);
    background: var(--bg-app); border: 1px solid var(--border-subtle); border-radius: var(--r-full); padding: 3px 9px; margin: 0 6px 6px 0; }
  @media (max-width: 760px) { .drawer { width: 100%; } }

  /* ── What changed — weekly movers strip ──────────────────────────────── */
  .wc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(216px, 1fr)); gap: 12px; }
  .wc-item { border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 12px 14px 10px; background: var(--bg-app); }
  .wc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 7px; min-height: 31px; }
  .wc-label { font-size: var(--text-sm); color: var(--text-muted); font-weight: var(--weight-semi); line-height: 1.3; }
  .wc-top .sbadge { flex-shrink: 0; }
  .wc-val { font-size: var(--text-lg); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; color: var(--text-primary); display: flex; align-items: baseline; gap: 8px; }
  .wc-ch { font-size: var(--text-sm); font-weight: var(--weight-bold); }
  .wc-item svg { margin-top: 7px; }

  /* ── Skeleton loading ─────────────────────────────────────────────────── */
  .skeleton-card { border: 1px solid var(--border-subtle); border-radius: var(--r-md); background: var(--bg-card);
    padding: 18px 20px; position: relative; overflow: hidden; }
  .skeleton-card::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(140,140,170,0.07), transparent); animation: shimmer 1.5s infinite; }
  .sk-bar { background: var(--border-subtle); border-radius: var(--r-sm); }
  @keyframes shimmer { 100% { transform: translateX(100%); } }

  /* ── Empty states ─────────────────────────────────────────────────────── */
  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 32px 24px; }
  .empty-state .es-ic { width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
    background: var(--accent-bg); color: var(--accent); margin-bottom: 14px; }
  .empty-state .es-title { font-size: var(--text-base); font-weight: var(--weight-bold); color: var(--text-primary); margin-bottom: 6px; }
  .empty-state .es-body { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.55; max-width: 460px; margin-bottom: 16px; }
  .empty-state .es-actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }

  /* ── Sticky health summary bar — command-centre persistence on scroll ──── */
  .health-bar { position: fixed; top: var(--appbar-h); left: 0; right: 0; z-index: 40;
    transform: translateY(-110%); transition: transform 200ms ease, opacity 200ms ease; opacity: 0; }
  .health-bar.show { transform: none; opacity: 1; }
  .health-bar-inner { display: flex; align-items: center; gap: 16px; max-width: 1460px; margin: 0 auto;
    padding: 8px 24px; background: var(--bg-elevated); border-bottom: 1px solid var(--border-default); box-shadow: var(--shadow-sm); }
  .health-bar .hb-metric { display: inline-flex; align-items: baseline; gap: 5px; font-size: var(--text-sm); color: var(--text-muted); }
  .health-bar .hb-metric b { color: var(--text-primary); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
  .health-bar .hb-spacer { flex: 1; }
  @media (max-width: 760px) { .health-bar { display: none; } }

  /* ── Chart card footer — interpretation + view-as-table + ask AI ──────── */
  .chart-foot { display: flex; align-items: center; gap: 12px; margin-top: 9px; padding-top: 9px;
    border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .cf-note { font-size: var(--text-xs); color: var(--text-faint); line-height: 1.45; flex: 1 1 200px; }
  .cf-btn { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--weight-semi); font-family: inherit;
    padding: 4px 9px; border-radius: var(--r-sm); border: 1px solid var(--border-default); background: var(--bg-card);
    color: var(--text-secondary); cursor: pointer; transition: all var(--motion-fast); white-space: nowrap; }
  .cf-btn:hover { color: var(--text-primary); border-color: var(--text-faint); }
  .cf-btn .oi-ic { color: var(--text-faint); }
  .cf-btn:hover .oi-ic { color: var(--text-secondary); }
  .cf-table-wrap { margin-top: 10px; max-height: 320px; overflow: auto; border: 1px solid var(--border-subtle); border-radius: var(--r-md); }
  .cf-table-wrap table { font-size: var(--text-sm); }
  .cf-table-wrap thead th { position: sticky; top: 0; background: var(--bg-card); }

  /* ── Industry benchmark chip ──────────────────────────────────────────── */
  .bm-chip { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); font-weight: var(--weight-semi);
    color: var(--text-muted); background: var(--border-subtle); border-radius: var(--r-full);
    padding: 2px 7px 2px 8px; white-space: nowrap; cursor: help; vertical-align: middle; }
  .bm-chip .bm-cat { color: var(--text-faint); font-weight: var(--weight-medium); }
  .bm-chip .bm-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .bm-chip .bm-dot.good { background: var(--good); }
  .bm-chip .bm-dot.bad  { background: var(--warn); }
  .bm-chip .bm-q { width: 12px; height: 12px; border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; border: 1px solid var(--text-faint); color: var(--text-faint); font-size: var(--text-xs); font-weight: var(--weight-bold); }

  /* ── Agent insights ─────────────────────────────────────────────────── */
  .insight { border-left: 3px solid var(--accent); }
  .agentbadge {
    display: inline-flex; align-items: center; gap: var(--s-1);
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--accent);
    background: var(--accent-bg); padding: 4px 10px; border-radius: var(--r-full);
  }
  .insight .head { font-size: var(--text-base); font-weight: var(--weight-semi); color: var(--text-primary); margin: var(--s-3) 0; line-height: 1.4; }
  .insight ul { list-style: none; margin: 0 0 var(--s-1); padding: 0; }
  .insight li { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.55; padding: var(--s-1) 0 var(--s-1) var(--s-4); position: relative; }
  .insight li:before { content: '–'; position: absolute; left: 0; color: var(--accent); }

  /* ── Action rows ─────────────────────────────────────────────────────── */
  .actionrow {
    display: flex; gap: var(--s-2); align-items: flex-start;
    padding: var(--s-2) 0; border-top: 1px solid var(--border-subtle);
    font-size: var(--text-sm);
  }
  .actionrow .t { flex: 1; color: var(--text-secondary); }
  .actionrow.done .t { color: var(--text-muted); text-decoration: line-through; text-decoration-color: rgba(74,222,128,.5); }
  .actionrow .stat {
    font-size: var(--t-micro); padding: 2px 7px; border-radius: var(--r-full);
    font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); white-space: nowrap;
  }
  .stat.done   { background: var(--good-bg); color: var(--good); }
  .stat.chrome { background: var(--warn-bg); color: var(--warn); }
  .stat.input  { background: var(--accent-bg); color: var(--accent); }
  .stat.open   { background: var(--bad-bg); color: var(--bad); }
  .stat.noreg  { background: var(--border-subtle); color: var(--text-faint); }
  .actionrow .ev { font-size: var(--t-micro); color: var(--text-muted); font-style: italic; }
  .impact { font-size: var(--t-micro); color: var(--good); padding: 2px 0 0 2px; }

  /* ── Live action table — sortable, column-aligned (priority · action · confidence · £/mo) ── */
  .live-head, .live-row {
    display: grid; grid-template-columns: 96px minmax(0,1fr) 124px 92px;
    gap: var(--s-4); align-items: start;
  }
  .live-head { padding: 9px var(--s-3); border-bottom: 1px solid var(--border-default); }
  .live-hcell {
    display: inline-flex; align-items: center; gap: 4px; background: none; border: none; padding: 0;
    cursor: pointer; font-family: inherit; font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--text-faint); transition: color 120ms;
  }
  .live-hcell:hover { color: var(--text-secondary); }
  .live-hcell.active { color: var(--text-primary); }
  .live-hcell.right { justify-content: flex-end; }
  .live-hcell .caret { font-size: var(--text-xs); line-height: 1; }
  .live-row {
    padding: 15px var(--s-3); border-top: 1px solid var(--border-subtle);
    transition: background 120ms ease;
  }
  .live-row:hover { background: rgba(255,255,255,0.022); }
  .live-row .lr-pill {
    display: inline-flex; align-items: center; max-width: 100%;
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
    padding: 3px 9px; border-radius: var(--r-full); white-space: nowrap; line-height: 1.5;
  }
  .live-row .lr-conf { font-size: var(--text-xs); font-weight: var(--weight-semi); letter-spacing: var(--tracking-wide); text-transform: none; }
  .live-row .lr-title { font-size: var(--text-sm); line-height: 1.5; color: var(--text-secondary); }
  .live-row .lr-title b { color: var(--text-primary); font-weight: var(--weight-bold); }
  .live-row .lr-ev { font-size: var(--text-xs); color: var(--text-faint); font-style: italic; margin-top: 4px; line-height: 1.45; }
  .live-row .lr-cta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .live-row .lr-impact { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .live-row .lr-impact .amt { font-size: var(--text-base); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); }
  .live-row .lr-impact .per { display: block; font-size: var(--text-xs); color: var(--text-faint); margin-top: 1px; }
  @media (max-width: 760px) {
    .live-head { display: none; }
    .live-row { display: flex; flex-direction: column; gap: 6px; }
    .live-row .lr-impact { text-align: left; }
  }

  /* ── Specialist channel table — same column grid as the live read, headers per channel ── */
  .sp-head, .sp-row {
    display: grid; grid-template-columns: 96px minmax(0,1fr) 124px 92px;
    gap: var(--s-4); align-items: start;
  }
  .sp-head { padding: 7px var(--s-3) 6px; }
  .sp-hcell {
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
    color: var(--text-faint);
  }
  .sp-hcell.right { text-align: right; }
  .sp-row {
    padding: 13px var(--s-3); border-top: 1px solid var(--border-subtle);
    font-size: var(--text-sm); transition: background 120ms ease;
  }
  .sp-row:hover { background: rgba(127,127,127,0.045); }
  .sp-pri { display: inline-flex; align-items: center; gap: 6px; }
  .sp-pri .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sp-pri .lbl { font-size: var(--text-xs); font-weight: var(--weight-bold); color: var(--text-secondary); }
  .sp-text { color: var(--text-secondary); line-height: 1.5; }
  .sp-row.done .sp-text { color: var(--text-muted); text-decoration: line-through; text-decoration-color: rgba(74,222,128,.5); }
  .sp-ev { font-size: var(--t-micro); color: var(--text-muted); font-style: italic; margin-top: 3px; }
  .sp-cta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .sp-agent { font-size: var(--text-xs); color: var(--text-faint); }
  .sp-status { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .sp-impact { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sp-impact .amt { font-size: var(--text-base); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); }
  .sp-impact .per { display: block; font-size: var(--text-xs); color: var(--text-faint); margin-top: 1px; }
  .sp-impact .dash { font-size: var(--text-xs); color: var(--text-faint); }
  @media (max-width: 760px) {
    .sp-head { display: none; }
    .sp-row { display: flex; flex-direction: column; gap: 6px; }
    .sp-impact { text-align: left; }
  }
  .impact .label { color: var(--text-muted); font-style: italic; }
  .markbtn {
    font-size: var(--t-micro); padding: 3px 8px; border-radius: var(--r-sm);
    cursor: pointer; background: transparent; color: var(--text-muted);
    border: 1px solid var(--border-default); transition: all var(--motion-fast);
  }
  .markbtn:hover { background: var(--bg-card-hover); color: var(--accent); border-color: var(--accent); }

  /* ── Zones: vertical sections inside a tab ───────────────────────────── */
  .zone-header {
    display: flex; align-items: baseline; gap: var(--s-3);
    margin-bottom: var(--s-4); padding-bottom: var(--s-3);
    border-bottom: 1px solid var(--border-subtle);
  }
  .zone-number {
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide);
    color: var(--accent); background: var(--accent-bg);
    padding: 3px 9px; border-radius: var(--r-sm);
    text-transform: uppercase;
  }
  .zone-title {
    font-size: var(--text-lg); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug);
    color: var(--text-primary);
  }
  .zone-meta {
    margin-left: auto; font-size: var(--text-xs); color: var(--text-muted);
    font-weight: var(--weight-medium);
  }

  /* ── Collapsible "Show more" button ──────────────────────────────────── */
  .show-more {
    margin-top: var(--s-3); padding: var(--s-2) var(--s-4);
    background: transparent; border: 1px dashed var(--border-default);
    color: var(--text-muted); border-radius: var(--r-sm);
    cursor: pointer; font-size: var(--text-sm); font-weight: var(--weight-semi); font-family: inherit;
    transition: all var(--motion-fast); width: 100%;
  }
  .show-more:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }

  /* ── Pattern card (Intelligence findings list) ───────────────────────── */
  .pattern-card {
    padding: var(--s-3) var(--s-4);
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-md);
    transition: border-color var(--motion-fast);
  }
  .pattern-card:hover { border-color: var(--border-default); }
  .pattern-card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--s-3); margin-bottom: var(--s-2);
  }
  .pattern-card-tags { display: flex; align-items: center; gap: var(--s-2); }
  .pattern-card-tag {
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; padding: 2px 7px; border-radius: var(--r-sm);
  }
  .pattern-card-meta {
    font-size: var(--text-xs); color: var(--text-faint);
    display: flex; gap: var(--s-3);
  }
  .pattern-card-meta b { color: var(--text-secondary); }
  .pattern-card-desc { font-size: var(--text-sm); color: var(--text-primary); line-height: 1.5; }
  .pattern-diagnoses {
    margin-top: var(--s-3); padding-left: var(--s-3);
    border-left: 2px solid var(--accent);
    display: flex; flex-direction: column; gap: var(--s-2);
  }
  .pattern-diagnosis {
    padding: var(--s-2) var(--s-3); background: var(--bg-card); border-radius: var(--r-sm);
  }
  .pattern-diagnosis-head {
    display: flex; align-items: center; gap: var(--s-2); margin-bottom: 4px;
  }
  .why-pill {
    background: var(--accent-bg); color: var(--accent);
    font-size: var(--text-xs); padding: 1px 6px; border-radius: var(--radius-sm);
    font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
  }
  .pattern-diagnosis-body { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5; }

  /* ── Toolbar (slim filter bar inside a zone) ─────────────────────────── */
  .toolbar {
    display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap;
    padding: var(--s-2) var(--s-3); background: var(--bg-card);
    border: 1px solid var(--border-subtle); border-radius: var(--r-md);
    margin-bottom: var(--s-3); font-size: var(--text-xs);
  }
  .toolbar label {
    color: var(--text-muted); font-size: var(--text-xs); font-weight: var(--weight-bold);
    letter-spacing: var(--tracking-wide); text-transform: uppercase; margin-right: var(--s-1);
  }
  .toolbar select {
    /* background-color, not the `background` shorthand: the shorthand resets
       background-image and takes the drawn caret off with it. */
    background-color: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border-default); border-radius: var(--r-sm);
    padding: 4px 8px; font-size: var(--text-sm); font-family: inherit;
    cursor: pointer;
  }
  .toolbar .divider { width: 1px; height: 16px; background: var(--border-subtle); margin: 0 var(--s-2); }
  .toolbar-count { margin-left: auto; color: var(--text-muted); font-size: var(--text-xs); }

  /* ── Stat strip (replaces 4-card KPI grids when they're just numbers) ── */
  .stat-strip {
    display: flex; align-items: center; gap: var(--s-5);
    padding: var(--s-4) var(--s-5); background: var(--bg-card);
    border: 1px solid var(--border-subtle); border-radius: var(--r-md);
    flex-wrap: wrap;
  }
  .stat-strip-item { display: flex; flex-direction: column; gap: 2px; }
  .stat-strip-val { font-size: var(--text-xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-strip-label {
    font-size: var(--text-xs); font-weight: var(--weight-semi); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--text-muted);
  }
  .stat-strip-divider { width: 1px; height: 22px; background: var(--border-subtle); }

  /* ── Forecast empty state ────────────────────────────────────────────── */
  .forecast-empty {
    text-align: center; padding: var(--s-7) var(--s-5);
    background: var(--bg-card); border: 1px dashed var(--border-default);
    border-radius: var(--r-lg);
  }
  .forecast-empty-icon {
    width: 56px; height: 56px; margin: 0 auto var(--s-4);
    border-radius: var(--r-md); background: var(--accent-bg);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xl); font-weight: var(--weight-semi);
  }
  .forecast-empty-title {
    font-size: var(--text-lg); font-weight: var(--weight-semi); letter-spacing: var(--tracking-snug);
    color: var(--text-primary); margin-bottom: var(--s-2);
  }
  .forecast-empty-body {
    font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.6;
    max-width: 540px; margin: 0 auto var(--s-5);
  }
  .forecast-empty-cta {
    display: inline-flex; gap: var(--s-2);
  }
  .btn-primary {
    padding: 9px 16px; background: var(--accent); border: 1px solid var(--accent);
    color: white; font-size: var(--text-sm); font-weight: var(--weight-semi); border-radius: var(--r-sm);
    cursor: pointer; font-family: inherit; transition: all var(--motion-fast);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost {
    padding: 9px 16px; background: transparent; border: 1px solid var(--border-default);
    color: var(--text-secondary); font-size: var(--text-sm); font-weight: var(--weight-semi); border-radius: var(--r-sm);
    cursor: pointer; font-family: inherit; transition: all var(--motion-fast);
  }
  .btn-ghost:hover { color: var(--text-primary); border-color: var(--text-muted); }

  /* ── Status banners (Brand Age, Connection Health) ───────────────────── */
  .status-banner {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-2) var(--s-4);
    border: 1px solid; border-radius: var(--r-md);
    font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5;
    flex-wrap: wrap;
  }
  .status-banner code {
    background: var(--bg-card); padding: 2px 6px; border-radius: var(--radius-md);
    font-family: var(--font-mono); font-size: var(--text-xs);
    color: var(--text-primary);
  }
  .status-banner-tag {
    font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; flex-shrink: 0;
  }
  .status-banner-body { flex: 1; }

  /* ── Footer ──────────────────────────────────────────────────────────── */
  .app-footer {
    max-width: 1320px; margin: var(--s-7) auto 0;
    padding: var(--s-5) var(--s-6);
    border-top: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap;
    color: var(--text-faint); font-size: var(--text-xs);
  }
  .app-footer-brand {
    display: flex; align-items: center; gap: var(--s-2);
    color: var(--text-muted); font-weight: var(--weight-semi);
  }
  .app-footer-dot {
    width: 4px; height: 4px; border-radius: var(--r-full); background: var(--text-faint);
  }
  .app-footer a { color: var(--text-muted); }
  .app-footer a:hover { color: var(--text-secondary); }

  /* ── Focus states (a11y) ─────────────────────────────────────────────── */
  button:focus-visible, select:focus-visible, input:focus-visible,
  .tab:focus-visible, .subtab:focus-visible, .workspace-chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  /* ── Hero card (Overview's "this week" panel) ────────────────────────── */
  .hero {
    position: relative; overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-lg);
    padding: var(--s-6) var(--s-7);
  }
  .hero-bg {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(800px 300px at 0% 0%, rgba(139,92,246,0.10), transparent 60%),
      radial-gradient(600px 300px at 100% 100%, rgba(139,92,246,0.04), transparent 60%);
  }
  .hero-content { position: relative; z-index: 1; }
  .hero-meta {
    display: inline-flex; align-items: center; gap: var(--s-1);
    margin-bottom: var(--s-3);
  }
  .hero-headline {
    font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight);
    line-height: 1.1; margin-bottom: var(--s-2);
  }
  .hero-sub {
    font-size: var(--text-base); color: var(--text-secondary); line-height: 1.5;
    max-width: 640px; margin-bottom: var(--s-6);
  }
  .hero-stats {
    display: flex; align-items: center; gap: var(--s-5);
    padding: var(--s-4) 0; margin-bottom: var(--s-6);
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    flex-wrap: wrap;
  }
  .hero-stat { display: flex; flex-direction: column; gap: 2px; }
  .hero-stat-val { font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug); line-height: 1; }
  .hero-stat-label {
    font-size: var(--text-xs); font-weight: var(--weight-semi); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--text-muted);
  }
  .hero-stat-divider { width: 1px; height: 28px; background: var(--border-subtle); }
  .hero-grid {
    display: grid; grid-template-columns: 1fr 1.5fr; gap: var(--s-7);
  }
  @media (max-width: 720px) { .hero-grid { grid-template-columns: 1fr; gap: var(--s-5); } }
  .hero-col {}
  .hero-action {
    display: flex; gap: var(--s-3); padding: var(--s-3) 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .hero-action:last-child { border-bottom: 0; }
  .hero-action-rank {
    width: 22px; height: 22px; border-radius: var(--r-full);
    background: var(--accent-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-xs); font-weight: var(--weight-bold); flex-shrink: 0;
  }
  .hero-action-body { flex: 1; min-width: 0; }
  .hero-action-text {
    font-size: var(--text-sm); color: var(--text-primary); line-height: 1.45;
    margin-bottom: 4px;
  }
  .hero-action-meta {
    display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap;
  }

  /* ── Modals ──────────────────────────────────────────────────────────── */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
    padding: var(--s-5);
  }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border-default);
    border-radius: var(--r-lg); padding: var(--s-6);
    max-width: 560px; width: 100%; box-shadow: var(--shadow-lg);
  }
  .modal h3 { font-size: var(--text-base); font-weight: var(--weight-bold); margin-bottom: var(--s-1); }
  .modal .id { font-size: var(--t-meta); color: var(--text-muted); font-family: var(--font-mono); }
  .modal .actiontxt { font-size: var(--t-body); color: var(--text-secondary); margin: var(--s-3) 0 var(--s-4); line-height: 1.5; }
  .modal label { display: block; font-size: var(--t-meta); color: var(--text-muted); margin: var(--s-3) 0 var(--s-1); letter-spacing: var(--tracking-wide); text-transform: uppercase; }
  .modal input[type=text] {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border-default);
    color: var(--text-primary); border-radius: var(--r-sm);
    padding: var(--s-2) var(--s-3); font-size: var(--t-body); font-family: inherit;
  }
  .modal .cmd {
    background: var(--bg-input); border: 1px solid var(--border-default);
    border-radius: var(--r-sm); padding: var(--s-3); font-family: var(--font-mono);
    font-size: var(--text-sm); color: var(--accent); word-break: break-all; line-height: 1.5;
  }
  .modal .row { display: flex; gap: var(--s-2); margin-top: var(--s-4); }
  .modal button {
    padding: var(--s-2) var(--s-4); border-radius: var(--r-sm); cursor: pointer;
    font-size: var(--text-sm); font-weight: var(--weight-semi); border: 1px solid var(--border-default);
    background: var(--bg-elevated); color: var(--text-primary);
    transition: all var(--motion-fast);
  }
  .modal button:hover { background: var(--bg-card-hover); border-color: var(--border-default); }
  .modal button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .modal button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .modal .hint { font-size: var(--t-meta); color: var(--text-muted); margin-top: var(--s-3); line-height: 1.5; }
  .copied { color: var(--good) !important; }

  /* ═══ UI V3 — the Phase 2 restructure (approved 2026-09-23) ═══════════════
     One nav, one destination, one profit number, tap-to-open explainers.
     Values come from the app theme variables; the light design-tokens.css
     migration is the next step and replaces this block's var() targets. */
  /* Nothing renders a .appbar — greta-app.jsx does not contain the string, in V3 or in
     the legacy shell behind GRETA_UI_V3=false — and on the /app path this whole thing is
     an iframe that already starts below the shell's own 58px bar. But the nav and the ask
     bar were both still pinning at --appbar-h: 57px. So the sidebar floated 57px below
     the sheet it sits beside, ran 57px taller than its own viewport, and the ask bar hung
     mid-page with content scrolling up through the strip above it and shearing off at its
     top edge. A V3-owned offset, so the legacy rails and health bar keep --appbar-h. */
  .v3-root { --v3-nav-w: 232px; --v3-top: 0px; }
  .v3-shell { display: flex; align-items: flex-start; max-width: 1800px; margin: 0 auto; }
  /* The nav is CHROME, not content: its own surface, so the working sheet to its right reads as
     the place where the job happens. Previously both sat on the same cream and the product looked
     like one undifferentiated document. */
  .v3-nav {
    position: sticky; top: var(--v3-top); align-self: flex-start;
    width: var(--v3-nav-w); flex-shrink: 0; height: calc(100vh - var(--v3-top));
    overflow-y: auto; padding: var(--space-4) var(--space-3) var(--space-6);
    background: var(--color-chrome); border-right: 1px solid var(--color-line);
    display: flex; flex-direction: column; gap: 1px;
  }
  .v3-nav-search {
    display: flex; align-items: center; gap: 9px; margin: 0 2px 14px; padding: 10px 11px; min-height: 44px;
    border: 1px solid var(--border-default); border-radius: var(--r-md); background: var(--bg-card);
    color: var(--text-muted); font-size: var(--text-sm); cursor: pointer; font-family: inherit; width: calc(100% - 4px);
  }
  .v3-nav-search kbd { margin-left: auto; font-size: var(--text-xs); color: var(--text-faint); font-family: inherit; }
  .v3-nav-group {
    font-size: var(--text-xs); letter-spacing: var(--tracking-wide); text-transform: uppercase;
    color: var(--color-faint); font-weight: var(--weight-medium); padding: var(--space-5) 10px var(--space-2);
  }
  .v3-nav-group:first-of-type { padding-top: 2px; }
  /* Active state is an accent RULE plus ink text, not orange text on an orange wash — a tinted
     pill with tinted text is the muddiest thing a nav can do, and it made the current page harder
     to read than the rest of the list. */
  .v3-nav-item {
    position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
    min-height: 38px; padding: 7px 11px 7px 12px;
    border: 0; border-radius: var(--radius-md); background: none; color: var(--color-muted);
    font-family: inherit; font-size: var(--text-sm); font-weight: var(--weight-medium);
    letter-spacing: var(--tracking-snug); text-align: left; cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .v3-nav-item:hover { background: var(--color-panel); color: var(--color-ink); }
  .v3-nav-item.active { background: var(--color-panel); color: var(--color-ink); font-weight: var(--weight-semi); }
  .v3-nav-item.active::before {
    content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px;
    background: var(--color-accent); border-radius: var(--radius-full);
  }
  .v3-nav-item.active svg { color: var(--color-accent); }
  /* The working sheet. White on the darker canvas, so content has an edge and the page stops
     looking like a printed report bleeding to the margins. */
  .v3-main {
    flex: 1; min-width: 0; max-width: 1180px;
    margin: var(--space-5) var(--space-6) var(--space-12);
    padding: var(--space-8) var(--space-8) var(--space-10);
    background: var(--color-panel); border: 1px solid var(--color-line);
    box-shadow: var(--shadow-panel);
  }
  /* ── Reading measure ──────────────────────────────────────────────
     Only prose is capped. Tables, charts, bars and the ranked boards are comparisons
     across a width and keep all of it, which is why this is a list of the classes that
     actually carry sentences rather than a blanket rule on the sheet. Prose lists are
     unclassed; the layout lists all carry a class, which is what :not([class]) uses to
     tell them apart. */
  .v3-main p,
  .v3-main ul:not([class]) > li,
  .v3-main ol:not([class]) > li,
  .v3-main .note, .v3-main .v3-note, .v3-main .hint, .v3-main .v3-empty,
  .v3-main .ev, .v3-main .sub, .v3-main .muted, .v3-main .micro,
  .v3-main .explainer .imp, .v3-main .explainer .obs,
  .v3-main .actionrow .t, .v3-main .v3-dofirst-t,
  .v3-main .card.insight .head, .v3-main .card.insight p,
  .v3-main .v3-vitals-plain, .v3-main .show-more, .v3-main .v3-prose, .v3-main .v3-muted,
  .v3-page-q { max-width: var(--measure); }

  .v3-page-head { margin-bottom: var(--space-6); padding-bottom: var(--space-4);
                  border-bottom: 1px solid var(--color-line); }
  .v3-page-title { font-size: var(--text-xl); font-weight: var(--weight-semi); margin: 0 0 2px;
                   letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); }
  .v3-page-q { color: var(--color-muted); font-size: var(--text-sm); margin: 0;
               line-height: var(--leading-snug); }

  /* Today: one big number, both bases on screen */
  .v3-today { display: flex; flex-direction: column; gap: 18px; }
  /* A 2px black rule across the top of the hero read as a print rule. Space does the separating. */
  .v3-hero { padding-top: 0; }
  .v3-hero-lab { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
                 font-size: var(--text-xs); letter-spacing: var(--tracking-wide);
                 text-transform: uppercase; color: var(--color-faint); font-weight: var(--weight-medium); }
  .v3-big { font-family: var(--font-mono, ui-monospace), monospace; font-size: var(--text-display);
            line-height: 1; font-weight: var(--weight-medium); letter-spacing: var(--tracking-tight);
            margin: var(--space-3) 0 var(--space-2); color: var(--color-ink);
            font-variant-numeric: tabular-nums; }
  .v3-big-muted { color: var(--text-faint); }
  /* Thinner than the money flow below it (12px). Two full-width bars of the same weight, stacked
     and meaning different things, gave the eye no way to tell which one to read first. */
  .v3-bar { position: relative; height: 4px; background: var(--color-sunken); margin: var(--space-4) 0 var(--space-2); max-width: 520px; }
  .v3-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .v3-bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-primary); }
  .v3-pace { font-size: var(--text-sm); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .v3-pace.good { color: var(--good); } .v3-pace.bad { color: var(--bad); }
  .v3-sub { font-size: var(--text-sm); color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .v3-muted { color: var(--text-muted); }
  .v3-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); display: inline-block; }
  .v3-refresh { margin-top: 10px; background: var(--accent-bg); border: 1px solid var(--accent); color: var(--accent); border-radius: var(--r-md); min-height: 44px; padding: 0 14px; font-family: inherit; font-size: var(--text-sm); font-weight: var(--weight-semi); cursor: pointer; }
  .v3-kick { font-size: var(--text-xs); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted); font-weight: var(--weight-semi); margin-bottom: 6px; }
  .v3-dofirst { border-top: 1px solid var(--border-subtle); padding-top: 14px; }
  .v3-dofirst-t { font-size: var(--text-lg); font-weight: var(--weight-semi); line-height: 1.35; margin-bottom: 4px; }
  .v3-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .v3-btn {
    min-height: 44px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--border-default);
    background: var(--bg-card); color: var(--text-primary); font-family: inherit; font-size: var(--text-sm); font-weight: var(--weight-semi); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .v3-btn:hover { border-color: var(--accent); color: var(--accent); }
  .v3-btn-p { background: var(--accent); border-color: var(--accent); color: #fff; }
  .v3-btn-p:hover { color: #fff; opacity: .92; }
  .v3-btn-sm { min-height: 36px; padding: 0 11px; font-size: var(--text-sm); font-weight: var(--weight-medium); }
  .v3-next { border-top: 1px solid var(--border-subtle); padding-top: 14px; }
  .v3-next-row { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); }
  .v3-num { font-family: var(--font-mono, ui-monospace), monospace; color: var(--text-muted); font-size: var(--text-sm); }
  .v3-note { border-left: 2px solid var(--accent); background: var(--accent-bg); padding: 10px 14px; font-size: var(--text-sm); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .v3-anchor { display: block; height: 0; scroll-margin-top: 80px; }

  /* Tap-to-open explainer and confidence sheets (never hover-only) */
  .v3-info-wrap { position: relative; display: inline-flex; }
  .v3-info {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-default); background: none;
    color: var(--text-muted); font-family: var(--font-mono, ui-monospace), monospace; font-size: var(--text-xs); line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    /* The dot stays 22px so it sits quietly beside the label, but the tap area is the
       full 44px: the ::after below needs this positioning context to expand from. */
    position: relative;
  }
  /* The tap target is the button; the dot or chip inside it carries the look. This
     keeps a 22px dot visually quiet while giving a finger the full 44px to aim at. */
  .v3-tap {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; min-width: 44px; padding: 11px; margin: -11px;
    background: none; border: 0; cursor: pointer; font: inherit; color: inherit;
  }
  .v3-tap + .v3-tap { margin-left: -4px; }
  .v3-tap:hover .v3-info, .v3-tap:hover .v3-conf { border-color: var(--accent); color: var(--accent); }
  .v3-conf {
    display: inline-flex; align-items: center; gap: 6px; position: relative; padding: 3px 9px;
    border: 1px solid var(--border-default); border-radius: var(--radius-full); background: none; font-family: inherit; font-size: var(--text-xs); font-weight: var(--weight-semi); color: var(--text-muted);
  }
  .v3-conf i { width: 8px; height: 8px; display: inline-block; }
  /* .micro uppercases, which is right for a three-word eyebrow and wrong for a sentence — it turned
     a careful caveat into SHOUTING AT THE OPERATOR. Prose gets its own class: same quiet colour,
     sentence case, normal letter-spacing. */
  .v3-note { font-family: var(--font-sans); font-size: var(--text-xs, 11px); line-height: 1.55;
             color: var(--text-faint, var(--color-muted)); text-transform: none; letter-spacing: 0;
             font-weight: var(--weight-normal); }

  /* Signal in the nav, which is the only thing on every screen. A count where there is work, a
     dot where something has stopped reporting. Both read from data Today already loaded, and
     neither renders unless there is something true to say — a permanent badge is wallpaper. */
  .v3-nav-item { position: relative; }
  .v3-nav-n { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs, 11px);
              color: var(--color-muted); background: var(--color-sunken, #EFEAE3);
              border-radius: var(--radius-md, 4px); padding: 0 5px; line-height: 1.5; }
  .v3-nav-item.active .v3-nav-n { color: var(--color-ink); }
  .v3-nav-alert { margin-left: auto; width: 6px; height: 6px; border-radius: 50%;
                  background: var(--color-warning, #B45309); flex-shrink: 0; }

  /* ── Loading, empty, and motion ──────────────────────────────────────────────────────────────
     Loading was a line of text, which tells the operator nothing about what is coming and makes
     the page jump when it arrives. Skeletons hold the shape of the thing being fetched, so the
     layout is stable and the wait reads as "this is loading" rather than "this is broken".
     Everything here is deliberately quiet: a slow shimmer, a 160ms fade, no sliding or scaling. */
  @keyframes v3-shimmer { 0% { background-position: -320px 0; } 100% { background-position: 320px 0; } }
  @keyframes v3-fade-in { from { opacity: 0; } to { opacity: 1; } }

  .v3-skel { display: block; height: 10px; border-radius: var(--radius-none, 0);
             background: linear-gradient(90deg, var(--color-sunken, #EFEAE3) 0%,
                                          var(--color-line) 50%, var(--color-sunken, #EFEAE3) 100%);
             background-size: 640px 100%; animation: v3-shimmer 1.4s linear infinite; }
  .v3-skel-row { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3, 12px);
                 align-items: center; padding: var(--space-3, 12px) 0;
                 border-top: 1px solid var(--color-line); }
  .v3-skel-n   { width: 14px; height: 10px; }
  .v3-skel-gbp { width: 62px; height: 12px; }
  .v3-skel-lines { display: grid; gap: 6px; }
  .v3-skel-lines .v3-skel:nth-child(1) { width: 78%; }
  .v3-skel-lines .v3-skel:nth-child(2) { width: 42%; height: 6px; }
  .v3-enter { animation: v3-fade-in 160ms ease-out both; }
